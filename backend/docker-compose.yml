services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
      ORG_CODES: ${ORG_CODES:-ASHA-HYD-04,DEMO}
      VYTRA_DB: /data/vytra.db
    volumes:
      - vytra-data:/data
    restart: unless-stopped

volumes:
  vytra-data:
