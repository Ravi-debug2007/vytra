name: vytra
description: Offline ASHA screening aid for anemia and jaundice risk classes. Not a medical device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: 9.1.1
  equatable: 2.0.7
  camera: 0.11.2
  google_mlkit_face_mesh_detection: 0.5.0
  permission_handler: 11.4.0
  sqflite_sqlcipher: 3.4.1
  flutter_secure_storage: 9.2.4
  pdf: 3.11.3
  printing: 5.14.2
  share_plus: 10.1.4
  uuid: 4.5.1
  path_provider: 2.1.5
  connectivity_plus: 6.1.4
  workmanager: 0.5.2
  http: 1.3.0
  package_info_plus: 8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
