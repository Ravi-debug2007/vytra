name: vytra
description: VYTRA — offline-first screening aid for trained ASHA workers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  camera: 0.11.2
  google_mlkit_face_mesh_detection: 0.5.0
  sqflite_sqlcipher: 3.4.1
  flutter_secure_storage: ^9.2.2
  pdf: 3.11.1
  printing: 5.14.2
  share_plus: 10.1.4
  shared_preferences: ^2.3.2
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
